# Per-agent model settings. Tune freely; restart the service to apply.
# Model IDs are Bedrock EU cross-region inference profiles (the host role is allowed to invoke eu.anthropic.claude-*).
# Opus 5.5: thinking is always on (effort is the only control, default medium) and it rejects forced tool_choice
# and sampling params, so the engine never sends temperature/top_p or tool_choice any/tool.

agents:
  cto:    { model: opus-5-5,   effort: high,   max_tokens: 32000 }
  intake: { model: opus-5-5,   effort: high,   chat_effort: medium, max_tokens: 32000 }   # reviews/doc at high; interview turns at medium (faster, cheaper, same model)
  ba:     { model: sonnet-5,   effort: high,   chat_effort: medium, max_tokens: 32000 }   # chat_effort: the kickoff conversation (agents/talk.py)
  ta:     { model: opus-5-5,   effort: high,   chat_effort: medium, max_tokens: 64000 }
  tp:     { model: sonnet-5,   effort: high,   chat_effort: medium, max_tokens: 64000 }
  de:     { model: sonnet-5,   effort: high,   chat_effort: medium, max_tokens: 64000 }
  qa:     { model: sonnet-5,   effort: medium, chat_effort: medium, max_tokens: 32000 }
  guide:  { model: sonnet-5,   effort: medium, max_tokens: 8000 }    # Sage: read-only project Q&A (the bubble)

models:
  opus-5-5:
    id: eu.anthropic.claude-opus-5-5
    label: Claude Opus 5.5
    # USD per million tokens. First-party list prices; Bedrock is partner-priced and may differ,
    # so adjust from https://aws.amazon.com/bedrock/pricing/ if needed.
    price: { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }
    # when Bedrock can't serve this model (503/overloaded) after the retries, the step carries on with the next one (user, 10-05:
    # "Opus 5 as fallback for Opus 5.5; still an issue, then Sonnet")
    # (each fallback was checked on the host with an agent-like request: effort + tools; Sonnet 4.5 rejects effort, so it isn't one)
    fallback: [opus-5, opus-4-8, sonnet-5]
  opus-5:
    id: eu.anthropic.claude-opus-5
    label: Claude Opus 5
    # price assumed equal to Opus 5.5 (not verified): reconcile with https://aws.amazon.com/bedrock/pricing/
    price: { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }
    fallback: [opus-4-8, sonnet-5]
  opus-4-8:
    id: eu.anthropic.claude-opus-4-8
    label: Claude Opus 4.8
    # price assumed ($5/$25, the Opus 4.x list price; not verified for 4.8): reconcile with the AWS bill
    price: { input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25 }
    fallback: [sonnet-5]
  sonnet-4-6:
    id: eu.anthropic.claude-sonnet-4-6
    label: Claude Sonnet 4.6
    # price assumed ($3/$15, the Sonnet 4.x list price; not verified): reconcile with the AWS bill
    price: { input: 3.00, output: 15.00, cache_read: 0.30, cache_write: 3.75 }
    fallback: [opus-5]
  sonnet-5:
    id: eu.anthropic.claude-sonnet-5
    label: Claude Sonnet 5
    fallback: [sonnet-4-6, opus-5]
    price: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }
  haiku-4-5:
    id: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    label: Claude Haiku 4.5
    price: { input: 1.00, output: 5.00, cache_read: 0.10, cache_write: 1.25 }
